name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run state feature Clippy
        run: cargo clippy -p z180-core --all-targets --features state -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Run independent DAA conformance gate
        run: cargo run -p z180-cli --release -- sst --dir tests/sst/v1 --only 27
      - name: Run state feature tests
        run: cargo test -p z180-core --features state
      - name: Build Python binding
        working-directory: crates/z180-py
        run: uv run --with maturin maturin develop --release
      - name: Run Python binding tests
        working-directory: crates/z180-py
        run: uv run pytest tests
      - name: Install wasm-pack
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2.85.1
        with:
          tool: wasm-pack@0.15.0
      - name: Build Node.js WebAssembly binding
        if: runner.os == 'Linux'
        working-directory: crates/z180-wasm
        run: wasm-pack build --target nodejs --scope zcore
      - name: Run Node.js WebAssembly smoke test
        if: runner.os == 'Linux'
        working-directory: crates/z180-wasm
        run: node tests/node-smoke.cjs
      - name: Run reference differential gate
        run: uv run --project tools/reference pytest tools/reference/test_differential.py -q --hypothesis-profile=gate
