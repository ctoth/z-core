language = "C"
include_guard = "Z180_H"
cpp_compat = true
usize_is_size_t = true
documentation = true
style = "type"
autogen_warning = "/* Generated by cbindgen 0.29.4. Edit the Rust declarations, not this file. */"
header = """
/* ABI 1. C99 and C++11. See README.md for ownership and threading contracts. */
#if defined(_WIN32) && !defined(Z180_STATIC)
#  if defined(Z180_BUILD)
#    define Z180_API __declspec(dllexport)
#  else
#    define Z180_API __declspec(dllimport)
#  endif
#else
#  define Z180_API
#endif
"""

[fn]
prefix = "Z180_API"

[parse]
parse_deps = false
